[package]
name = "clearspace"
version = "1.0.0"
description = "Clearspace — Developer Storage Intelligence"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "clearspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
walkdir = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
